# Runs the H2 experiment. Change .github/run-requests/h2 to start or resume it: the
# script resumes from results/h2_shared_state/raw_results.csv, committed at the end of
# each run. GITHUB_TOKEN pushes do not retrigger workflows, so this cannot loop.
name: h2
on:
  push:
    branches: [research/bio-to-ai]
    paths: [.github/run-requests/h2]
permissions:
  contents: write
concurrency:
  group: h2
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy scipy pytest scikit-learn
      - run: python -m pytest tests/test_h2.py -q --tb=short
      # Stop well inside the job limit, so partial results are always committed.
      - name: Run experiment
        run: timeout 320m python experiments/h2_shared_state.py || echo "exit code $?"
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/h2_shared_state
          git diff --cached --quiet && exit 0
          git commit -m "Record H2 results from run ${GITHUB_RUN_ID}"
          git pull --rebase origin research/bio-to-ai
          git push origin HEAD:research/bio-to-ai
