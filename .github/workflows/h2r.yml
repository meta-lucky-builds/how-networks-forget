# Runs H2R. Change .github/run-requests/h2r to start or resume it. Its first word picks the
# mode (stage0, stage0-retry, full); the rest only makes the change a change. The script
# resumes from results/h2r/raw_results.csv, committed at the end of each run. GITHUB_TOKEN
# pushes do not retrigger workflows, so this cannot loop.
name: h2r
on:
  push:
    branches: [research/bio-to-ai]
    paths: [.github/run-requests/h2r]
permissions:
  contents: write
concurrency:
  group: h2r
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy scipy pytest scikit-learn
      - run: python -m pytest tests/test_h2r.py -q --tb=short
        timeout-minutes: 20
      # Stop well inside the job limit, so partial results are always committed. Only the
      # timeout counts as a normal stop: a refusal or a crash still fails the job, after the
      # commit step below has saved what exists.
      - name: Run experiment
        run: |
          read -r mode _ < .github/run-requests/h2r || true
          case "$mode" in
            stage0) args="--stage0" ;;
            stage0-retry) args="--stage0 --retry" ;;
            full) args="" ;;
            *) echo "::error::unknown mode '$mode' in .github/run-requests/h2r"; exit 1 ;;
          esac
          code=0
          timeout 320m python experiments/h2r.py $args || code=$?
          if [ "$code" = 124 ]; then
            echo "::warning::stopped at the time limit; change the request file to resume"
            exit 0
          fi
          exit "$code"
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p results/h2r
          git add results/h2r
          git diff --cached --quiet && exit 0
          git commit -m "Record H2R results from run ${GITHUB_RUN_ID}"
          git pull --rebase origin research/bio-to-ai
          git push origin HEAD:research/bio-to-ai
